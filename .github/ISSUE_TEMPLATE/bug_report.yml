name: Bug report / 问题报告
description: Report a reproducible problem without private account data / 报告不含账号隐私的可复现问题
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not post passwords, verification codes, cookies, tokens, email addresses, real IP addresses, conversation text, or attachments.

        请勿提交密码、验证码、Cookie、令牌、账号邮箱、真实 IP、聊天正文或附件。
  - type: input
    id: version
    attributes:
      label: App version / 应用版本
      placeholder: 0.2.1
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform / 平台
      options:
        - macOS Apple Silicon
        - macOS Intel or Rosetta
        - Windows x64 setup
        - Windows x64 portable
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 复现步骤
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result / 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result / 实际结果
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check / 隐私确认
      options:
        - label: I removed all credentials and private account or conversation data. / 我已删除所有凭据、账号和聊天隐私信息。
          required: true
